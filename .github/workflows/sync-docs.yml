name: Sync MAN docs

on:
  schedule:
    # GitHub Actions cron uses UTC. 02:10 UTC is 10:10 in Asia/Shanghai.
    - cron: '10 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Sync docs from MAN
        run: pnpm run sync:docs

      - name: Commit changes and trigger deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add docs

          if git diff --cached --quiet; then
            echo "Documentation is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync latest MAN documentation"
          git push origin HEAD:main

          gh api \
            --method POST \
            "repos/${GH_REPO}/dispatches" \
            -f event_type=md_changes
