name: Auto merge dependency updates

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-dependencies-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      !github.event.repository.fork &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Merge the verified pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api \
            --method PUT \
            "repos/${GH_REPO}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="${PR_HEAD_SHA}" \
            -f commit_title="${PR_TITLE} (#${PR_NUMBER})"
